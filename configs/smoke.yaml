profile: smoke
seed: 42
paths:
  data_dir: data/processed_smoke
  cache_dir: data/cache
  results_dir: results/smoke
  reports_dir: reports/smoke
data:
  hf_dataset: ai4privacy/pii-masking-300k
  train_lang: en
  stress_langs: [de, fr, it]
  n_train: 300
  n_val: 100
  n_test: 100
  n_cross_lingual: 100
  gate_balanced_min_negatives: 100
stress:
  rare_label_fraction: 0.30
  n_context_only: 50
gate:
  embed_model: sentence-transformers/all-MiniLM-L6-v2
  n_features: 8
  n_train: 200
  classical_full_size: true
  seeds_classical: [0, 1]
  seeds_kernel: [0]
  kernel_train_cap: 100
  vqc: {n_qubits: 8, n_layers: 3, epochs: 5, batch_size: 32, lr: 0.05}
  shots: 1024
  noise_probs: [0.001, 0.01]
  hardware: {enabled: false, max_test_sentences: 100}
  barren_plateau: {qubits: [2, 4, 6, 8], n_samples: 20}
  finetune: {epochs: 1, batch_size: 32, lr: 2.0e-5}
masker:
  seeds: [0]
  deberta: {model: microsoft/deberta-v3-small, epochs: 1, batch_size: 8, lr: 5.0e-5, max_length: 256, early_stopping_patience: 1}
  llms:
    qwen: {model: Qwen/Qwen2.5-0.5B-Instruct}
    smollm: {model: HuggingFaceTB/SmolLM2-360M-Instruct}
  lora: {r: 16, alpha: 32, dropout: 0.05, target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]}
  sft: {epochs: 1, batch_size: 4, grad_accum: 1, lr: 2.0e-4, max_length: 512, max_steps: 30}
  inference: {max_new_tokens: 128, batch_size: 4}
eval:
  bootstrap_resamples: 200
  ci: 0.95
  latency_warmup: 1
