profile: smoke
seed: 42
paths:
  data_dir: data/processed_smoke
  raw_dir: data/raw
  cache_dir: data/cache
  results_dir: results/smoke
  reports_dir: reports/smoke
data:
  hf_dataset: ai4privacy/pii-masking-300k
  files:   # relative to the dataset repo
    train_en: data/train/1english_openpii_30k.jsonl
    test_en: data/validation/1english_openpii_8k.jsonl
    de: data/validation/german_openpii_8k.jsonl
    fr: data/validation/french_openpii_8k.jsonl
    it: data/validation/italian_openpiii_8k.jsonl
  train_lang: en
  stress_langs: [de, fr, it]   # keys into data.files
  n_train: 300
  n_val: 100
  n_test: 100
  n_cross_lingual: 100
  gate_balanced_min_negatives: 100
stress:
  rare_label_fraction: 0.30
  min_test_support: 1   # rare labels with fewer test spans are reported as untestable
  obfuscation_kinds: [email, phone, name, id]
  n_context_only: 50
gate:
  embed_model: sentence-transformers/all-MiniLM-L6-v2
  embed_batch_size: 64
  n_features: 8
  n_train: 200               # gate training size for the quantum and small classical models
  classical_full_size: true  # also train the classical models on the whole gate train pool
  eval_n: 100                # one fixed balanced test subset scored by every model
  noisy_eval_n: 30           # noisy simulation is ~100x slower, so it uses a subset of eval_n
  seeds_classical: [0, 1]
  seeds_kernel: [0]
  seeds_finetune: [0]
  mlp: {hidden: 7, max_iter: 300}   # hidden=7 -> 71 params (VQC has 74)
  vqc: {n_qubits: 8, n_layers: 3, epochs: 5, batch_size: 32, lr: 0.05, init_std: 0.5}
  kernel: {train_cap: 100, feature_maps: [angle, iqp], c_grid: [0.1, 1.0, 10.0], val_n: 50}
  shots: 1024
  noise_probs: [0.001, 0.01]
  hardware: {enabled: false, max_test_sentences: 100}   # needs explicit user confirmation
  barren_plateau: {qubits: [2, 4, 6, 8], n_layers: 3, n_samples: 20}
  finetune: {epochs: 1, batch_size: 32, lr: 2.0e-5, full_size: true}
masker:
  seeds: [0]
  deberta: {model: microsoft/deberta-v3-small, epochs: 1, batch_size: 8, lr: 5.0e-5, max_length: 256, early_stopping_patience: 1}
  llms:
    qwen: {model: Qwen/Qwen2.5-0.5B-Instruct}
    smollm: {model: HuggingFaceTB/SmolLM2-360M-Instruct}
  lora: {r: 16, alpha: 32, dropout: 0.05, target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]}
  sft: {epochs: 1, batch_size: 4, grad_accum: 1, lr: 2.0e-4, max_length: 512, max_steps: 30}
  inference: {max_new_tokens: 128, batch_size: 4}
eval:
  bootstrap_resamples: 200
  ci: 0.95
  latency_warmup: 1
