profile: full
seed: 42
paths:
  data_dir: data/processed
  raw_dir: data/raw
  cache_dir: data/cache
  ckpt_dir: checkpoints
  results_dir: results
  reports_dir: reports
data:
  hf_dataset: ai4privacy/pii-masking-300k
  files:   # relative to the dataset repo
    train_en: data/train/1english_openpii_30k.jsonl
    test_en: data/validation/1english_openpii_8k.jsonl
    de: data/validation/german_openpii_8k.jsonl
    fr: data/validation/french_openpii_8k.jsonl
    it: data/validation/italian_openpiii_8k.jsonl
  train_lang: en
  stress_langs: [de, fr, it]   # keys into data.files
  n_train: 5000
  n_val: 1000
  n_test: 1000
  n_cross_lingual: 1000
  gate_balanced_min_negatives: 1000
stress:
  rare_label_fraction: 0.30
  min_test_support: 5   # rare labels with fewer test spans are reported as untestable
  obfuscation_kinds: [email, phone, name, id]
  n_context_only: 50
gate:
  embed_model: sentence-transformers/all-MiniLM-L6-v2
  embed_batch_size: 256
  n_features: 8
  n_train: 2000              # gate training size for the quantum and small classical models
  classical_full_size: true  # also train the classical models on the whole gate train pool
  eval_n: 2000               # one fixed balanced test subset scored by every model
  noisy_eval_n: 500          # noisy simulation is ~100x slower, so it uses a subset of eval_n
  seeds_classical: [0, 1, 2, 3, 4]
  seeds_kernel: [0, 1, 2]
  seeds_finetune: [0, 1, 2]
  mlp: {hidden: 7, max_iter: 300}   # hidden=7 -> 71 params (VQC has 74)
  vqc: {n_qubits: 8, n_layers: 3, epochs: 30, batch_size: 32, lr: 0.05, init_std: 0.5}
  kernel: {train_cap: 500, feature_maps: [angle, iqp], c_grid: [0.1, 1.0, 10.0], val_n: 500}
  shots: 1024
  noise_probs: [0.001, 0.01]
  hardware: {enabled: false, max_test_sentences: 100}   # needs explicit user confirmation
  barren_plateau: {qubits: [2, 4, 6, 8], n_layers: 3, n_samples: 200}
  finetune: {epochs: 3, batch_size: 32, lr: 2.0e-5, full_size: true}
masker:
  seeds: [0, 1, 2]
  eval_sets: [clean, obf_email, obf_phone, obf_name, obf_id, obf_all, rare, cross_de, cross_fr, cross_it, context_only]
  eval_max_docs: null        # evaluate whole sets
  n_latency_docs: 30         # documents timed one at a time for p50/p95 latency
  deberta: {model: microsoft/deberta-v3-small, epochs: 5, batch_size: 16, lr: 5.0e-5, max_length: 512, early_stopping_patience: 2}
  llms:
    qwen: {model: Qwen/Qwen2.5-0.5B-Instruct}
    smollm: {model: HuggingFaceTB/SmolLM2-360M-Instruct}
  zero_shot: {model: Qwen/Qwen2.5-0.5B-Instruct}
  lora: {r: 16, alpha: 32, dropout: 0.05, target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]}
  sft: {epochs: 2, batch_size: 2, grad_accum: 8, lr: 2.0e-4, max_length: 1024, max_steps: -1}
  inference: {max_new_tokens: 384, batch_size: 48}
pipeline:
  seed: 0
  ckpt: checkpoints/deberta_seed0/best
  eval_sets: [clean, obf_all, rare, cross_de, context_only]
  eval_n: 500
  latency_docs: 50
  gate_train_n: 2000
  val_n: 2000
  target_recall: 0.99     # each gate's threshold keeps >= 99% of validation PII sentences
  minilm_ft: {train_n: 8000, epochs: 2, batch_size: 32, lr: 2.0e-5}
eval:
  bootstrap_resamples: 1000
  ci: 0.95
  latency_warmup: 3
